name: test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pyyaml pytest
      - run: pytest
      - name: Generated files match commands.yaml
        run: |
          out="$(mktemp -d)"
          python generate_commands.py commands.yaml "$out" fc_commands_generated
          diff -u fc_commands_generated.hpp "$out/fc_commands_generated.hpp"
          diff -u fc_commands_generated.cpp "$out/fc_commands_generated.cpp"
